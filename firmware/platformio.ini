; Firmware MedDrop untuk ESP32 Dev Module (Espressif).
; Buka folder firmware/ ini di VS Code (ekstensi PlatformIO), lalu Upload dan Monitor.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps = bblanchon/ArduinoJson@^7.0.0
