# Konfigurasi MedDrop. Dibaca backend saat server dijalankan (restart setelah mengubah).

classifier:
  backend: mock                # mock | keras. "mock" BUKAN model sungguhan; UI menampilkan banner.
  threshold_with_barcode: 0.60 # keyakinan foto minimum bila ada barcode yang valid
  threshold_photo_only: 0.85   # keyakinan foto minimum bila tanpa barcode (lebih ketat)
  min_confidence_floor: 0.50   # di bawah nilai ini barang dianggap tidak teridentifikasi

weight:
  # Kemasan dianggap KOSONG bila berat <= tare + empty_margin_g + empty_margin_pct% x tare.
  empty_margin_g: 0.5          # derau timbangan (gram)
  empty_margin_pct: 3          # variasi berat kemasan kosong antar-produksi (% dari tare)
  # Barang dianggap TERLALU BERAT bila berat > bruto + gross_tolerance_pct% x bruto.
  gross_tolerance_pct: 5

points:
  per_valid_deposit: 10        # poin per setoran yang DITERIMA
  daily_limit_deposits: 3      # maksimum setoran valid per anggota per hari

bin:
  capacity_g: 5000             # kapasitas tempat penampungan (gram)
  alert_fill_pct: 80           # alert BIN_FULL saat kepenuhan >= nilai ini (%)
